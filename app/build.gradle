plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencheps'
    compileSdk 34

    defaultConfig {
        applicationId "com.opencheps"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.2.0"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    testRuntimeOnly 'com.microsoft.onnxruntime:onnxruntime:1.23.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
}

// Keep model binaries out of git patches. Download once at build time, never on the phone.
def preparePieceModel = tasks.register('preparePieceModel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_piece_model.py', '--tests'
    inputs.file rootProject.file('tools/prepare_piece_model.py')
    outputs.file file('src/main/assets/piece-model/chess-tiles-v2.onnx')
    outputs.file file('src/main/assets/piece-model/ThirdPartyNotices-onnxruntime.txt')
    outputs.dir file('src/test/resources/piece-model')
}
tasks.named('preBuild').configure { dependsOn preparePieceModel }
